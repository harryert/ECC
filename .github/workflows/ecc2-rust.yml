name: ECC2 Rust

on:
  push:
    branches:
      - "codex/issue2272-target-task-20261105"
    paths:
      - "ecc2/**"
      - ".github/workflows/ecc2-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/codex/issue2272-target-task-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 956975d7eec98371fabcfdaddf8ad8fa9c9fe0ce
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96
      - name: Build release runtime
        run: cargo build --locked --manifest-path ecc2/Cargo.toml --release --bin ecc-tui
      - name: Prepare runtime artifact and checksums
        run: |
          artifact_dir="$RUNNER_TEMP/ecc-tui-linux-x86_64"
          mkdir -p "$artifact_dir"
          install -m 0755 ecc2/target/release/ecc-tui "$artifact_dir/ecc-tui"
          printf '%s\n' '956975d7eec98371fabcfdaddf8ad8fa9c9fe0ce' > "$artifact_dir/SOURCE_SHA"
          sha256sum "$artifact_dir/ecc-tui" > "$artifact_dir/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecc-tui-linux-x86_64-956975d7eec98371fabcfdaddf8ad8fa9c9fe0ce
          path: ${{ runner.temp }}/ecc-tui-linux-x86_64/
          if-no-files-found: error
          retention-days: 3
