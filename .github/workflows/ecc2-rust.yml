name: ECC2 focused native handoff regression

on:
  create:

permissions:
  contents: read

jobs:
  focused-handoff:
    if: github.ref_type == 'branch' && github.ref_name == 'codex/issue2272-target-task-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96
      - name: Run the focused native handoff regression
        run: CARGO_BUILD_JOBS=2 cargo test --locked --manifest-path ecc2/Cargo.toml --bin ecc-tui tests::native_handoff_uses_target_task_not_parent_task -- --exact
