name: ECC2 patched Linux one-shot build
on:
  push:
    branches:
      - build/ecc2-patch-linux-20261028

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_TERM_COLOR: "never"
    steps:
      - name: Checkout exact patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: verify/ecc2-g0-native-offhost-candidate-20261029

      - name: Validate patch source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d4caee7dacd1ef0e509532cc4308d9d77b80235a"
          git diff --exit-code
          test -f ecc2/Cargo.lock

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version
          cargo --version

      - name: Validate native G0 identity, assignment, inbox, and dispatch
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            native_assign_uses_lead_working_dir_not_operator_cwd \
            drain_inbox_uses_configured_worker_profile_not_lead_profile \
            native_lead_schedule_reuses_one_identity_across_two_ticks \
            auto_dispatch_does_not_recursively_route_assigned_handoffs \
            internal_assignment_notice_is_non_dispatchable_but_visible_in_load \
            independently_authored_template_context_is_dispatchable \
            legacy_template_notice_remains_suppressed_after_provenance_upgrade \
            auto_dispatch_backlog_routes_multiple_lead_inboxes
          do
            cargo test --release --locked --no-default-features --manifest-path ecc2/Cargo.toml "$pattern" -- --list | grep -F "$pattern"
            cargo test --release --locked --no-default-features --manifest-path ecc2/Cargo.toml "$pattern" -- --nocapture
          done

      - name: Build native Linux ECC2 binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --manifest-path ecc2/Cargo.toml

      - name: Record artifact provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ecc2-linux-artifact
          install -m 0755 ecc2/target/release/ecc-tui ecc2-linux-artifact/ecc-tui
          git rev-parse HEAD > ecc2-linux-artifact/source-commit.txt
          printf "%s\n" "${GITHUB_SHA}" > ecc2-linux-artifact/workflow-commit.txt
          (cd ecc2-linux-artifact && sha256sum ecc-tui > sha256sum.txt)
          file ecc2-linux-artifact/ecc-tui
          ldd ecc2-linux-artifact/ecc-tui

      - name: Upload short-lived Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ecc2-linux-d4caee7
          path: ecc2-linux-artifact/
          if-no-files-found: error
          retention-days: 3
