name: ECC2 patched Linux one-shot build
on:
  push:
    branches:
      - build/ecc2-patch-linux-20261028

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_TERM_COLOR: "never"
    steps:
      - name: Checkout exact patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: fix/ecc2-recursive-handoff-20261028

      - name: Validate patch source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7af7a18bd5e775572024dafb8474e4258bd3e8ac"
          git diff --exit-code
          test -f ecc2/Cargo.lock

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version
          cargo --version

      - name: Verify two dispatch cycles and nonrecursive routing
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --no-default-features --manifest-path ecc2/Cargo.toml auto_dispatch_does_not_recursively_route_assigned_handoffs -- --nocapture
          cargo test --release --locked --no-default-features --manifest-path ecc2/Cargo.toml internal_assignment_notice_is_not_dispatchable_or_counted -- --nocapture
          cargo test --release --locked --no-default-features --manifest-path ecc2/Cargo.toml auto_dispatch_backlog -- --nocapture
          cargo test --release --locked --no-default-features --manifest-path ecc2/Cargo.toml template_launch_notice_is_not_a_second_dispatch_request -- --nocapture

      - name: Build native Linux ECC2 binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --manifest-path ecc2/Cargo.toml

      - name: Record artifact provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ecc2-linux-artifact
          install -m 0755 ecc2/target/release/ecc-tui ecc2-linux-artifact/ecc-tui
          git rev-parse HEAD > ecc2-linux-artifact/source-commit.txt
          printf "%s\n" "${GITHUB_SHA}" > ecc2-linux-artifact/workflow-commit.txt
          (cd ecc2-linux-artifact && sha256sum ecc-tui > sha256sum.txt)
          file ecc2-linux-artifact/ecc-tui
          ldd ecc2-linux-artifact/ecc-tui

      - name: Upload short-lived Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ecc2-linux-7af7a18
          path: ecc2-linux-artifact/
          if-no-files-found: error
          retention-days: 3
